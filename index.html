<html lang="es">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
        
        /* Colores Corporativos Tinka */
        :root {
            --tinka-red: #E3001B;
            --tinka-blue: #0033A0;
            --tinka-yellow: #FFD100;
            --tinka-green: #00A859;
            --tinka-green-dark: #008744;
            --tinka-bg: #F4F7F6;
            --tinka-text: #333333;
        }

        .bg-tinka-green { background-color: var(--tinka-green); }
        .bg-tinka-green_dark { background-color: var(--tinka-green-dark); }
        .text-tinka-green { color: var(--tinka-green); }
        .border-tinka-green { border-color: var(--tinka-green); }
        .bg-tinka-yellow { background-color: var(--tinka-yellow); }
        .text-tinka-yellow { color: var(--tinka-yellow); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--tinka-green); }

        .chat-scroll {
            scrollbar-color: var(--tinka-green) transparent;
            scrollbar-width: thin;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Nav Items UI Update */
        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            margin-bottom: 0.25rem;
            border-radius: 0.75rem;
            color: #475569;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-item:hover {
            background-color: #f1f5f9;
        }
        .nav-item.active {
            background-color: var(--tinka-green);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 168, 89, 0.2);
        }
        .badge-count {
            background-color: #e2e8f0;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            margin-left: auto;
        }
        .nav-item.active .badge-count {
            background-color: rgba(255,255,255,0.2);
            color: white;
        }
        .badge-total {
            background-color: var(--tinka-yellow);
            color: #333;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .chat-bubble-bot {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0 1rem 1rem 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .chat-bubble-user {
            background: var(--tinka-yellow);
            color: #333;
            border-radius: 1rem 0 1rem 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #94a3b8;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>

        function exportToCSV() {

            csvContent += `Tono Activo:, "${toneConfigs[currentTone].title}", "${toneConfigs[currentTone].desc}"\n`;
            
            let totalInputs = 0;
            Object.keys(kbData).forEach(k => { if(kbData[k].type === 'category' && kbData[k].items) totalInputs += kbData[k].items.length; });
            csvContent += `Total de Inputs RAG:, ${totalInputs}\n\n`;

            // Lógicas
            csvContent += "--- 2. REGLAS Y LÓGICA DEL BOT ---\n";
            csvContent += `Componente,Descripción,Regla Vivo\n`;
            csvContent += `"Motor de 2 Fases","Evita falsos positivos","SI input tiene express|whatsapp|resultado|tutorial ENTONCES resolver inmediato SINO ir a búsqueda semántica"\n`;
            csvContent += `"Enrutamiento","Derivación tutoriales/juegos","SI input incluye 'tutorial' ENTONCES derivar paso a paso y blog"\n`;
            csvContent += `"Cross-Selling","Submenú de sugerencias","SI juego es Tinka ENTONCES ofrecer (Suscripción/Express/Promos) SINO ofrecer solo (Promos)"\n`;
            csvContent += `"Escalamiento a Humano","Derivación a Call Center","SI fallos_consecutivos >= 3 O pide 'asesor' ENTONCES derivar a web de contacto"\n\n`;

            // Q&A
            csvContent += "--- 3. BASE DE CONOCIMIENTOS (Q&A) ---\n";
            csvContent += "Categoría,Pregunta Entrenada,Respuesta Configurada,Texto del Enlace,URL de Destino\n";
            Object.keys(kbData).forEach(key => {
                const cat = kbData[key];
                if (cat.type === 'category' && cat.items) {
                    cat.items.forEach(item => {
                        let q = `"${item.q.replace(/"/g, '""')}"`;
                        let a = `"${toneConfigs[currentTone].transformText(item.a).replace(/"/g, '""')}"`;
                        let lt = item.linkText ? `"${item.linkText}"` : '""';
                        let lu = item.linkUrl ? `"${item.linkUrl}"` : '""';

            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = `Reporte_General_KB_Tinka_${new Date().getTime()}.csv`;
            link.click();
        }

        function toggleChat() {

                // Abrir Chat (Quitar hidden, añadir flex)
                panel.classList.remove('hidden');
                panel.classList.add('flex');
                if(fab) fab.classList.add('hidden');
                
                // Forzar scroll al final

                container.scrollTop = container.scrollHeight;

        function handleChatSubmit(e) {

            appendChatMessage(text, 'user');
            input.value = '';

            const typingId = showTyping();

        function simulateAIResponse(userText) {
            let lowerText = userText.toLowerCase();
            let matchedItem = null;
            let matchedCategoryKey = null;

            // ==============================================================
            // FASE 1: DEFINICIÓN ESTRICTA DE INTENCIONES CLAVE (PROTECCIÓN)
            // Esto asegura que palabras críticas intercepten la búsqueda antes
            // de que se confundan con nombres de juegos
            // ==============================================================
            const isExpress = lowerText.includes('express') || lowerText.includes('sin registro');
            const isWhatsapp = lowerText.includes('whatsapp') || lowerText.includes('wsp') || lowerText.includes('wasap');
            const isContacto = lowerText.includes('asesor') || lowerText.includes('humano') || lowerText.includes('contacto') || lowerText.includes('atencion al cliente') || lowerText.includes('atención');
            const isResultados = lowerText.includes('resultado') || lowerText.includes('ganadores') || lowerText.includes('ganaron') || lowerText.includes('salió') || lowerText.includes('salieron') || lowerText.includes('salio');
            
            // Regex flexible para atrapar intenciones de "aprender a jugar"
            const isTutorial = /(c[oó]mo\s+jugar|c[oó]mo\s+juego|c[oó]mo\s+se\s+juega|aprender\s+a\s+jugar|tutorial|gu[ií]a|paso\s+a\s+paso)/.test(lowerText);
            
            const isTodosLosJuegos = lowerText === 'ver todos los juegos' || lowerText === 'juegos' || lowerText === '¿cuáles son los juegos y cómo jugar?';
            const isJugarTinka = lowerText === 'quiero jugar tinka';
            const isJugarKabala = lowerText === 'quiero jugar kábala' || lowerText === 'quiero jugar kabala';
            const isJugarGanaDiario = lowerText === 'quiero jugar gana diario';
            const isJugarKinelo = lowerText === 'quiero jugar kinelo';
            const isJugarVideo = lowerText === 'quiero jugar videoloterías' || lowerText === 'quiero jugar videoloteria' || lowerText === 'quiero jugar videoloterias';
            const isOtrosProductos = lowerText.includes('te apuesto') || lowerText.includes('apuestas deportivas') || lowerText.includes('deportes') || lowerText.includes('partido') || lowerText.includes('fútbol') || lowerText.includes('futbol') || lowerText.includes('raspa y gana');

            // --- EJECUCIÓN FASE 1 (Retorno Inmediato si hay Match Fuerte) ---
            if (isContacto) {
                matchedItem = kbData['contacto'].items[0]; matchedCategoryKey = 'contacto';
            } 
            else if (isOtrosProductos) {
                matchedItem = kbData['otros_productos'].items[0]; matchedCategoryKey = 'otros_productos';
            }
            else if (isExpress) {
                matchedItem = kbData['compras'].items.find(i => i.q.toLowerCase().includes('express')); matchedCategoryKey = 'compras';
            } 
            else if (isWhatsapp) {
                matchedItem = kbData['compras'].items.find(i => i.q.toLowerCase().includes('whatsapp')); matchedCategoryKey = 'compras';
            } 
            else if (isResultados) {
                if (lowerText.includes('historias') || lowerText.includes('quiénes') || lowerText.includes('quienes') || lowerText.includes('verdad')) {
                    matchedItem = kbData['resultados'].items.find(i => i.q.toLowerCase().includes('historias'));
                } else if (lowerText.includes('vivo') || lowerText.includes('dónde veo') || lowerText.includes('donde veo')) {
                    matchedItem = kbData['resultados'].items.find(i => i.q.toLowerCase().includes('vivo'));
                } else {
                    matchedItem = kbData['resultados'].items.find(i => i.q.toLowerCase().includes('números ganadores'));
                }
                matchedCategoryKey = 'resultados';
            }
            else if (isTutorial) {
                // Derivación Inteligente de Tutoriales por producto (Tolerante a tildes)
                if(lowerText.includes('tinka')) {
                    matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase().includes('tutorial') && i.q.toLowerCase().includes('tinka'));
                } else if(lowerText.includes('kabala') || lowerText.includes('kábala') || lowerText.includes('cabala')) {
                    matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase().includes('tutorial') && (i.q.toLowerCase().includes('kabala') || i.q.toLowerCase().includes('kábala')));
                } else if(lowerText.includes('diario')) {
                    matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase().includes('tutorial') && i.q.toLowerCase().includes('diario'));
                } else if(lowerText.includes('kinelo')) {
                    matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase().includes('tutorial') && i.q.toLowerCase().includes('kinelo'));
                } else if(lowerText.includes('video') || lowerText.includes('casino') || lowerText.includes('videoloterías') || lowerText.includes('videoloteria')) {
                    matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase().includes('tutorial') && (i.q.toLowerCase().includes('video') || i.q.toLowerCase().includes('lotería') || i.q.toLowerCase().includes('loteria')));
                } else {
                    // Tutorial genérico (manda al menú)
                    matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase().includes('cuáles son los juegos'));
                }
                matchedCategoryKey = 'mecanicas';
            }
            else if (isTodosLosJuegos) {
                 matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase().includes('cuáles son los juegos'));
                 matchedCategoryKey = 'mecanicas';
                 let botReply = toneConfigs[currentTone].transformText(matchedItem.a);
                 appendChatMessage(botReply, 'bot', true);
                 appendQuickReplies([
                    { label: '🔴 La Tinka', query: 'Tutorial La Tinka' },
                    { label: '🟣 Kábala', query: 'Tutorial Kábala' },
                    { label: '🔵 Gana Diario', query: 'Tutorial Gana Diario' },
                    { label: '🟡 Kinelo', query: 'Tutorial Kinelo' },
                    { label: '🎰 Videoloterías', query: 'Tutorial Videoloterías' }
                 ]);
                 unrecognizedCount = 0;
                 return;
            }
            else if (isJugarTinka) {
                 matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase() === 'quiero jugar tinka');
                 matchedCategoryKey = 'mecanicas';
            }
            else if (isJugarKabala) {
                 matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase() === 'quiero jugar kábala');
                 matchedCategoryKey = 'mecanicas';
            }
            else if (isJugarGanaDiario) {
                 matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase() === 'quiero jugar gana diario');
                 matchedCategoryKey = 'mecanicas';
            }
            else if (isJugarKinelo) {
                 matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase() === 'quiero jugar kinelo');
                 matchedCategoryKey = 'mecanicas';
            }
            else if (isJugarVideo) {
                 matchedItem = kbData['mecanicas'].items.find(i => i.q.toLowerCase() === 'quiero jugar videoloterías');
                 matchedCategoryKey = 'mecanicas';
            }

            // ==============================================================
            // FASE 2: BÚSQUEDA SEMÁNTICA Y MAPEOS DIRECTOS
            // ==============================================================
            if (!matchedItem) {
                // Mapeos directos por raíces de palabras clave (Rápido y preciso)
                if (lowerText.includes('suscrip') || lowerText.includes('suscrib')) {
                    if (lowerText.includes('cancelar') || lowerText.includes('baja') || lowerText.includes('quitar')) {
                        matchedItem = kbData['suscripciones'].items.find(i => i.q.toLowerCase().includes('cancelar'));
                    } else {
                        matchedItem = kbData['suscripciones'].items.find(i => i.q.toLowerCase().includes('cómo me suscribo'));
                    }
                    matchedCategoryKey = 'suscripciones';
                } else if (lowerText.includes('combo') || (lowerText.includes('todas') && lowerText.includes('loter'))) {
                    matchedItem = kbData['compras'].items.find(i => i.q.toLowerCase().includes('combo'));
                    matchedCategoryKey = 'compras';
                } else if (lowerText.includes('promo') || lowerText.includes('bono') || lowerText.includes('promocion')) {
                    if (lowerText.includes('bienvenida') || lowerText.includes('nuevo') || lowerText.includes('primer')) {
                        matchedItem = kbData['promos'].items.find(i => i.q.toLowerCase().includes('bienvenida'));
                    } else if (lowerText.includes('código') || lowerText.includes('codigo')) {
                        matchedItem = kbData['promos'].items.find(i => i.q.toLowerCase().includes('código'));
                    } else {
                        // Promociones genéricas
                        matchedItem = kbData['promos'].items.find(i => i.q.toLowerCase().includes('vigentes'));
                    }
                    matchedCategoryKey = 'promos';
                } else if (lowerText.includes('cobrar') || lowerText.includes('cobro') || lowerText.includes('retirar')) {
                    matchedItem = kbData['cobros'].items[0];
                    matchedCategoryKey = 'cobros';
                } else if (lowerText.includes('registr') || lowerText.includes('cuenta') || lowerText.includes('contrase') || lowerText.includes('olvid')) {
                    if (lowerText.includes('olvid') || lowerText.includes('contrase')) {
                        matchedItem = kbData['registro'].items.find(i => i.q.toLowerCase().includes('olvidé'));
                    } else {
                        matchedItem = kbData['registro'].items.find(i => i.q.toLowerCase().includes('cómo me registro'));
                    }
                    matchedCategoryKey = 'registro';
                } else {
                    // Búsqueda Semántica por coincidencia de palabras
                    let bestMatch = null;
                    let bestScore = 0;
                    let bestCat = null;
                    const stopWords = ['como', 'cómo', 'que', 'qué', 'quiero', 'saber', 'mas', 'más', 'sobre', 'para', 'jugar', 'los', 'las', 'una', 'uno'];
                    const words = lowerText.replace(/[?¿!¡.,]/g, '').split(' ').filter(w => w.length > 3 && !stopWords.includes(w));

                    Object.keys(kbData).forEach(key => {
                        const cat = kbData[key];
                        if (cat.type === 'category' && cat.items) {
                            cat.items.forEach(item => {
                                let score = 0;
                                const qLower = item.q.toLowerCase();
                                words.forEach(w => {
                                    if (qLower.includes(w)) score += 2;
                                });
                                if (qLower.includes(lowerText)) score += 5;

                                if (score > bestScore) {
                                    bestScore = score;
                                    bestMatch = item;
                                    bestCat = key;
                                }
                            });
                        }
                    });

                    if (bestScore > 0) {
                        matchedItem = bestMatch;
                        matchedCategoryKey = bestCat;
                    }
                }
            }

            // ==============================================================
            // FASE 3: RESPUESTA, RENDERIZADO Y CROSS-SELLING
            // ==============================================================
            if (matchedItem) {
                unrecognizedCount = 0; // Resetear fallos
                let botReply = toneConfigs[currentTone].transformText(matchedItem.a);
                
                // Formateo de Enlaces Especiales (WhatsApp)
                if (matchedItem.linkText && matchedItem.linkUrl) {
                    if(matchedItem.q.toLowerCase().includes('whatsapp')) {
                        botReply += `<div class="mt-4 flex flex-col gap-2.5">
                                        <a href="https://wa.me/51912448677?text=Hola%2C%20quisiera%20saber%20c%C3%B3mo%20comprar%20por%20WhatsApp" target="_blank" class="flex items-center justify-center gap-2 bg-[#25D366] text-white text-[13px] font-bold px-4 py-3 rounded-xl hover:bg-[#1EBE57] transition-colors shadow-sm"><i class="fab fa-whatsapp text-lg"></i> <span>Abrir Chat de WhatsApp</span></a>
                                        <a href="${matchedItem.linkUrl}" target="_blank" class="block bg-slate-100 text-slate-600 text-center text-xs font-semibold px-4 py-2.5 rounded-xl hover:bg-slate-200 transition-colors">📖 Leer tutorial en el blog</a>
                                     </div>`;
                    } else {
                        botReply += `<div class="mt-4"><a href="${matchedItem.linkUrl}" target="_blank" class="inline-flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-tinka-green text-[13px] font-bold px-4 py-2.5 rounded-xl hover:bg-slate-200 transition-colors shadow-sm"><span>👉</span> ${matchedItem.linkText}</a></div>`;
                    }
                }

                // Submenú Inteligente de Resultados (Cuando piden números generales)
                if (isResultados && !lowerText.includes('historias') && !lowerText.includes('quiénes') && !lowerText.includes('vivo')) {
                     botReply += `<div class="mt-5 pt-4 border-t border-slate-100"><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-3">Resultados en la Web Oficial:</p></div>`;
                     appendChatMessage(botReply, 'bot', true);
                     const resultsMenu = `
                        <div class="flex flex-col gap-2">
                            <a href="https://www.latinka.com.pe/p/resultados.html" target="_blank" class="bg-white border border-slate-200 text-slate-700 text-sm font-semibold px-4 py-3 rounded-xl hover:bg-slate-50 transition-colors shadow-sm flex items-center justify-between"><span>🔴 La Tinka</span> <i class="fas fa-external-link-alt text-[10px] text-slate-400"></i></a>
                            <a href="https://www.latinka.com.pe/p/resultados.html" target="_blank" class="bg-white border border-slate-200 text-slate-700 text-sm font-semibold px-4 py-3 rounded-xl hover:bg-slate-50 transition-colors shadow-sm flex items-center justify-between"><span>🟣 Kábala</span> <i class="fas fa-external-link-alt text-[10px] text-slate-400"></i></a>
                            <a href="https://www.latinka.com.pe/p/resultados.html" target="_blank" class="bg-white border border-slate-200 text-slate-700 text-sm font-semibold px-4 py-3 rounded-xl hover:bg-slate-50 transition-colors shadow-sm flex items-center justify-between"><span>🔵 Gana Diario</span> <i class="fas fa-external-link-alt text-[10px] text-slate-400"></i></a>
                        </div>
                     `;
                     appendChatMessage(resultsMenu, 'bot', true);
                     return;
                }

                // Lógica de Cross-Selling en Botones
                let options = [];
                
                if (matchedCategoryKey !== 'contacto' && matchedCategoryKey !== 'otros_productos') {
                    // Contextualización inteligente por juego
                    const textToEvaluate = (lowerText + " " + matchedItem.q.toLowerCase());
                    const ctxTinka = textToEvaluate.includes('tinka');
                    const ctxKabala = textToEvaluate.includes('kabala') || textToEvaluate.includes('kábala') || textToEvaluate.includes('cabala');
                    const ctxDiario = textToEvaluate.includes('diario');
                    const ctxKinelo = textToEvaluate.includes('kinelo');
                    const ctxVideo = textToEvaluate.includes('video') || textToEvaluate.includes('lotería') || textToEvaluate.includes('loteria');

                    if (ctxTinka) {
                        if (!isJugarTinka) options.push({ label: '🔴 Jugar Tinka', query: 'Quiero jugar Tinka' });
                        options.push({ label: '🔁 Suscripción', query: '¿Cómo me suscribo?' });
                        options.push({ label: '🚀 Sin registro', query: '¿Qué es Tinka Express?' });
                    } else if (ctxKabala) {
                        if (!isJugarKabala) options.push({ label: '🟣 Jugar Kábala', query: 'Quiero jugar Kábala' });
                        options.push({ label: '🎁 Promociones', query: 'Promociones' });
                    } else if (ctxDiario) {
                        if (!isJugarGanaDiario) options.push({ label: '🔵 Jugar Gana Diario', query: 'Quiero jugar Gana Diario' });
                        options.push({ label: '🎁 Promociones', query: 'Promociones' });
                    } else if (ctxKinelo) {
                        if (!isJugarKinelo) options.push({ label: '🟡 Jugar Kinelo', query: 'Quiero jugar Kinelo' });
                        options.push({ label: '🎁 Promociones', query: 'Promociones' });
                    } else if (ctxVideo) {
                        if (!isJugarVideo) options.push({ label: '🎰 Jugar VideoLoterías', query: 'Quiero jugar Videoloterías' });
                        options.push({ label: '🎁 Promociones', query: 'Promociones' });
                    } else if (matchedCategoryKey === 'promos') {
                        options.push({ label: '🎮 Ver todos los juegos', query: 'Ver todos los juegos' });
                        options.push({ label: '🔴 Jugar Tinka', query: 'Quiero jugar Tinka' });
                    } else {
                        options.push({ label: '🎁 Ver Promociones', query: 'Promociones' });
                    }
                }

                // Solo imprimir el título si hay opciones para mostrar
                if (options.length > 0) {
                    botReply += `<div class="mt-5 pt-4 border-t border-slate-100">
                        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-3">Opciones relacionadas sugeridas:</p>
                    </div>`;
                    appendChatMessage(botReply, 'bot', true);
                    appendQuickReplies(options);
                } else {
                    appendChatMessage(botReply, 'bot', true);
                }

            } else {
                // --- MANEJO DE FALLOS Y ESCALAMIENTO A HUMANO ---
                unrecognizedCount++;
                if (unrecognizedCount >= 3) {
                    const fallbackMsg = toneConfigs[currentTone].transformText("Veo que no he podido entender exactamente lo que necesitas tras varios intentos. 😔 ¡Pero no te preocupes! Nuestro equipo de Atención al Cliente está listo para ayudarte personalmente.");
                    const contactUI = `<div class="flex flex-col gap-3"><p>${fallbackMsg}</p>
                        <div class="mt-2 p-4 bg-slate-50 border border-slate-200 rounded-2xl shadow-sm">
                            <p class="text-xs text-slate-500 font-medium mb-3 text-center">Comunícate con un asesor:</p>
                            <a href="https://blog.latinka.com.pe/contacto/" target="_blank" class="flex items-center justify-center gap-2 bg-slate-800 text-white text-sm font-bold px-4 py-3 rounded-xl hover:bg-slate-900 transition-colors shadow-md"><span>🎧</span> Ver Canales de Contacto</a>
                        </div>
                    </div>`;
                    appendChatMessage(contactUI, 'bot', true);
                    unrecognizedCount = 0; // Reiniciar tras derivar
                } else {
                    const fallbackMsg = toneConfigs[currentTone].transformText("Lo siento, no encuentro información exacta sobre eso en mi base de datos actual. ¿Te gustaría intentar con otras palabras o ver las promociones?");
                    appendChatMessage(fallbackMsg, 'bot', true);
                    appendQuickReplies([{ label: '🎁 Ver Promociones', query: 'Promociones' }]);
                }
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function notifyLoading(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => { toast.classList.add('opacity-0'); }, 2000);
        }

        // Arrancar
        initApp();
    </script>
</body>
</html>
